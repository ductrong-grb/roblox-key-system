<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lấy Key Script - Verification System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 32px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .icon { width: 60px; height: 60px; background: rgba(56,189,248,0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; color: #38bdf8; font-size: 28px; font-weight: bold; }
        h2 { color: #f8fafc; font-size: 20px; font-weight: 700; margin-bottom: 8px; }
        p { color: #94a3b8; font-size: 14px; line-height: 1.5; margin-bottom: 24px; }
        .btn { width: 100%; padding: 14px; background: #38bdf8; border: none; border-radius: 8px; color: #0f172a; font-weight: 700; font-size: 15px; cursor: pointer; transition: 0.2s; }
        .btn:hover { background: #0ea5e9; }
        .error-msg { background: rgba(239, 68, 68, 0.2); color: #f87171; padding: 12px; border-radius: 8px; border: 1px solid #ef4444; font-size: 13px; display: none; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🔑</div>
        <h2>XÁC THỰC THIẾT BỊ</h2>
        <p>Nhấn vào nút bên dưới để chuyển sang trang vượt link xác minh cho thiết bị của bạn.</p>
        
        <button id="btn-get" class="btn" onclick="startProcess()">LẤY KEY NGAY</button>
        <div id="error-box" class="error-msg"></div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (!token) {
            showError("Lỗi: Không tìm thấy Token xác minh! Vui lòng ấn 'Get Key' lại từ trong Game.");
        }

        async function startProcess() {
            if (!token) return;
            const btn = document.getElementById('btn-get');
            btn.innerText = "ĐANG KHỞI TẠO LINK...";
            btn.disabled = true;

            try {
                const response = await fetch(`/api/get-link?token=${token}`);
                const data = await response.json();

                if (response.ok && data.shortUrl) {
                    // Chuyển hướng sang link vuotnhanh.com
                    window.location.href = data.shortUrl;
                } else {
                    showError(data.error || "Mã phiên làm việc đã hết hạn. Hãy lấy link mới từ game!");
                }
            } catch (err) {
                showError("Lỗi kết nối đến máy chủ! Vui lòng thử lại.");
            }
        }

        function showError(msg) {
            document.getElementById('btn-get').style.display = 'none';
            const errBox = document.getElementById('error-box');
            errBox.innerText = msg;
            errBox.style.display = 'block';
        }
    </script>
</body>
</html>
